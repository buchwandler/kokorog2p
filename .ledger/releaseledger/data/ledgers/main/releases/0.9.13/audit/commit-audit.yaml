    observed_behavior:
      The Goruut backend now performs a side-effect-free executable-selection probe for
      availability, serializes singleton initialization, supports the Android platform
      compatibility bridge, and raises actionable platform errors. Goruut tests use an
      injected deterministic process by default, while live backend smoke tests are
      opt-in. Japanese Cutlet dependencies load lazily with an actionable extra-install
      message, and direct backend extras are documented.
