[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kokorog2p*"]

[tool.setuptools.package-data]
"kokorog2p.data" = ["*.json"]
"kokorog2p.en.data" = ["*.json"]
"kokorog2p.de.data" = ["*.json"]
"kokorog2p.fr.data" = ["*.json"]
"kokorog2p.ja.data" = ["*.txt"]
"kokorog2p.ko.data" = ["*.csv"]

[project]
name = "kokorog2p"
description = "A unified G2P (Grapheme-to-Phoneme) library for Kokoro TTS"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Holger Nahrstaedt", email = "nahrstaedt@gmail.com"}
]
keywords = ["g2p", "grapheme-to-phoneme", "tts", "text-to-speech", "kokoro", "phonemizer", "espeak"]
dependencies = [
    "abbr2words>=0.2.4,<0.3.0",
    "spokenform>=0.2.3,<0.3.0",
]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Multimedia :: Sound/Audio :: Speech',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Text Processing :: Linguistic',
]

dynamic=["version"]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "myst-parser>=2.0.0",
]
espeak = [
    "espeakng-loader>=0.1.0",
    "dlinfo>=1.2.1",
]
goruut = [
    "pygoruut>=0.8.0",
]
en = [
    "spacy>=3.5.0",
    "num2words>=0.5.12",
]
de = [
    "spacy>=3.5.0",
    "num2words>=0.5.12",
]
fr = [
    "spacy>=3.5.0",
    "num2words>=0.5.12",
]
zh = [
    "jieba>=0.42.1",
    "pypinyin>=0.49.0",
    "cn2an>=0.5.22",
    "pypinyin-dict>=0.8.0",
    "ordered-set>=4.1.0",
]
ja = [
    "pyopenjtalk>=0.3.0",
    "fugashi>=1.3.0",
    "jaconv>=0.3.4",
    "mojimoji>=0.0.13",
    "unidic>=1.1.0",
]
ko = [
    "jamo>=0.4.1",
    "nltk>=3.8.1",
]
he = [
    "phonikud"
]
mixed = [
    "lingua-language-detector>=2.0.0",
]
all = [
    "kokorog2p[espeak,goruut,en,de,fr,zh,ja,ko,he,mixed]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "kokorog2p[docs]",
]

[project.urls]
Homepage = "https://buchwandler.de/tools/kokorog2p/main/"
Repository = "https://github.com/buchwandler/kokorog2p"
Issues = "https://github.com/buchwandler/kokorog2p/issues"
Changelog = "https://github.com/buchwandler/kokorog2p/releases"

[tool.setuptools_scm]
write_to = "kokorog2p/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "espeak: marks tests that require espeak-ng",
    "spacy: marks tests that require spaCy",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["setup/*", "notebooks/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "C90"]
ignore = ["E501"]
per-file-ignores = {"__init__.py" = ["F401", "I001"], "__manifest__.py" = ["B018"], "kokorog2p/ko/english.py" = ["C901"], "kokorog2p/ko/numerals.py" = ["C901"], "kokorog2p/it/g2p.py" = ["C901"], "kokorog2p/ko/data/rules.py" = ["E501"], "benchmarks/*" = ["BLE001", "S110", "S112", "PLR1722", "DTZ011", "TRY004"], "tests/*" = ["BLE001"], "kokorog2p/*" = ["BLE001", "RUF012"], "kokorog2p/ko/*" = ["SIM102", "SIM115", "PLW0602"]}

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
exclude = ["setup/*", "notebooks/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false  # Disabled: too many errors from third-party libs without type stubs
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed: allow some untyped defs for practicality
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Relaxed
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false  # Disabled: too many errors from third-party libs
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "kokorog2p.ja.*",
    "kokorog2p.zh.*",
    "kokorog2p.ko.*",
    "kokorog2p.de.numbers",
    "kokorog2p.goruut_g2p",
    "kokorog2p.backends.goruut.*",
    "kokorog2p.backends.espeak.wrapper",
    "kokorog2p.fr.lexicon",
    "kokorog2p.fr.g2p",
    "kokorog2p.espeak_g2p",
    "kokorog2p.en.fallback",
    "kokorog2p.en.g2p",
    "kokorog2p.en.lexicon",
    "kokorog2p.words_mismatch",
    "kokorog2p.multilang",
]
ignore_errors = true

[tool.coverage.run]
source = ["kokorog2p"]
branch = true
omit = ["kokorog2p/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
