
target-version = "py310"
fix = true

[lint]
extend-select = [
    "B",
    "C90",
    "E501",  # line too long (default 88)
    "I",  # isort
    "UP",  # pyupgrade
]
exclude = ["setup/*", "notebooks/*"]

[format]
exclude = ["setup/*", "notebooks/*"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # ignore unused and unsorted imports in __init__.py
"__manifest__.py" = ["B018"]  # useless expression
"kokorog2p/ko/english.py" = ["C901"]  # convert_eng intentionally complex
"kokorog2p/ko/numerals.py" = ["C901"]  # process_num intentionally complex
"kokorog2p/it/g2p.py" = ["C901"]  # _word_to_phonemes intentionally complex
"kokorog2p/ko/data/rules.py" = ["E501"]  # rule data tables are hard to wrap
"benchmarks/*" = ["BLE001", "S110", "S112", "PLR1722", "DTZ011", "TRY004"]  # benchmarks are lenient
"tests/*" = ["BLE001"]  # broad exceptions OK in tests
"kokorog2p/*" = ["BLE001", "RUF012"]  # broad catches and mutable class attrs OK in G2P
"kokorog2p/ko/*" = ["SIM102", "SIM115", "PLW0602"]  # Korean module legacy code

[lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.mccabe]
max-complexity = 20
