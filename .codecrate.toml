[codecrate]
output = "context_kokorog2p.md"
keep_docstrings = true
dedupe = true
respect_gitignore = true
exclude = ["*/.venv/*", "context_kokorog2p.*"]
include = [
  "**/*.py",
  "**/*.toml",
  "**/*.rst",
  "**/*.md",
  "**/*.txt",
  "**/*.yaml",
  "**/*.yml",
  "LICENSE*",
]
split_max_chars = 2500000
layout = "full"
profile = "portable-agent"
emit_standalone_unpacker = true
