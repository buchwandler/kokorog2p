name: Run tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      KOKOROG2P_EXTERNAL_LEXPHON_DATA: "1"
      LEXPHON_DATA_HOME: ${{ github.workspace }}/.lexphon-data

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install eSpeak-ng (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y espeak-ng

      - name: Install eSpeak-ng (macOS)
        if: runner.os == 'macOS'
        run: brew install espeak-ng

      - name: Install eSpeak-ng (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install espeak-ng -y --no-progress
          $installDir = $null
          $registryPaths = @(
            "HKLM:\SOFTWARE\eSpeak NG",
            "HKLM:\SOFTWARE\WOW6432Node\eSpeak NG"
          )
          foreach ($registryPath in $registryPaths) {
            if (Test-Path $registryPath) {
              $candidate = (
                Get-ItemProperty -Path $registryPath -ErrorAction SilentlyContinue
              ).Path
              if ($candidate -and (Test-Path $candidate)) {
                $installDir = $candidate
                break
              }
            }
          }
          if (-not $installDir) {
            $command = Get-Command espeak-ng.exe -ErrorAction SilentlyContinue
            if (-not $command) {
              $command = Get-Command espeak.exe -ErrorAction SilentlyContinue
            }
            if ($command) {
              $installDir = Split-Path -Parent $command.Path
            }
          }
          if (-not $installDir) {
            $candidates = @(
              (Join-Path $env:ProgramFiles "eSpeak NG"),
              (Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "eSpeak NG")
            ) | Where-Object { $_ -and (Test-Path $_) }
            $installDir = $candidates | Select-Object -First 1
          }
          if (-not $installDir) {
            throw "eSpeak NG installation completed but its installation directory was not found."
          }
          $exe = Join-Path $installDir "espeak-ng.exe"
          $library = Join-Path $installDir "libespeak-ng.dll"
          $data = Join-Path $installDir "espeak-ng-data"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "eSpeak NG executable not found at $exe"
          }
          if (-not (Test-Path $library -PathType Leaf)) {
            throw "eSpeak NG library not found at $library"
          }
          if (-not (Test-Path $data -PathType Container)) {
            throw "eSpeak NG data directory not found at $data"
          }
          $installDir >> $env:GITHUB_PATH
          "KOKOROG2P_ESPEAK_EXECUTABLE=$exe" >> $env:GITHUB_ENV
          "KOKOROG2P_ESPEAK_LIBRARY=$library" >> $env:GITHUB_ENV
          "KOKOROG2P_ESPEAK_DATA=$data" >> $env:GITHUB_ENV
          $env:PATH = "$installDir;$env:PATH"
          $env:KOKOROG2P_ESPEAK_EXECUTABLE = $exe
          $env:KOKOROG2P_ESPEAK_LIBRARY = $library
          $env:KOKOROG2P_ESPEAK_DATA = $data
          Write-Host "eSpeak executable: $exe"
          Write-Host "eSpeak library:    $library"
          Write-Host "eSpeak data:       $data"
          & $exe --version
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
          python -m pip check
          python -m nltk.downloader cmudict
          python -m spacy download en_core_web_sm


      - name: Verify eSpeak installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "PATH=$env:PATH"
          Write-Host "KOKOROG2P_ESPEAK_EXECUTABLE=$env:KOKOROG2P_ESPEAK_EXECUTABLE"
          Write-Host "KOKOROG2P_ESPEAK_LIBRARY=$env:KOKOROG2P_ESPEAK_LIBRARY"
          Write-Host "KOKOROG2P_ESPEAK_DATA=$env:KOKOROG2P_ESPEAK_DATA"
          Get-Command espeak-ng.exe
          if (-not (Test-Path $env:KOKOROG2P_ESPEAK_EXECUTABLE -PathType Leaf)) {
            throw "Configured eSpeak executable does not exist."
          }
          if (-not (Test-Path $env:KOKOROG2P_ESPEAK_LIBRARY -PathType Leaf)) {
            throw "Configured eSpeak library does not exist."
          }
          if (-not (Test-Path $env:KOKOROG2P_ESPEAK_DATA -PathType Container)) {
            throw "Configured eSpeak data directory does not exist."
          }
          & $env:KOKOROG2P_ESPEAK_EXECUTABLE --version

      - name: Verify eSpeak backends
        run: |
          python -c "from kokorog2p.backends.espeak.cli_wrapper import CliPhonemizer; p = CliPhonemizer('en-us'); print('CLI eSpeak:', p.version)"
          python -c "from kokorog2p.backends.espeak.wrapper import Phonemizer; p = Phonemizer(); p.set_voice('en-us'); print('native eSpeak:', p.version, p.library_path)"
      - name: Provision released Lexphon data
        run: >-
          lexphon data install
          en-us:gold en-gb:gold fr-fr:gold
          de-de:gold de-de:crane de-de:espeak de-de:olaph de-de:lexhint
          sv-se:nst
          ru:lexhint th:lexhint-native vi:lexhint ja:lexhint ko:lexhint pt:lexhint

      - name: Verify released Lexphon data
        run: >-
          lexphon data verify
          en-us:gold en-gb:gold fr-fr:gold
          de-de:gold de-de:crane de-de:espeak de-de:olaph de-de:lexhint
          sv-se:nst
          ru:lexhint th:lexhint-native vi:lexhint ja:lexhint ko:lexhint pt:lexhint

      - name: Run full pytest suite
        run: python -m pytest

      - name: Quick reference compatibility
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: python benchmarks/benchmark_reference.py --quick --suite core

  live-reference:
    name: pinned live reference verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      KOKOROG2P_EXTERNAL_LEXPHON_DATA: "1"
      LEXPHON_DATA_HOME: ${{ github.workspace }}/.lexphon-data
    strategy:
      matrix:
        include:
          - reference: hexgrad-en-us-v1
            candidate: en-us-default
            corpus: en-us
          - reference: hexgrad-en-gb-v1
            candidate: en-gb-default
            corpus: en-gb
          - reference: semidark-de-v1
            candidate: de-default
            corpus: de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
          python -m pip install "misaki==0.9.4"
      - name: Run live reference benchmark once
        run: >-
          python benchmarks/benchmark_reference.py
          --reference "${{ matrix.reference }}"
          --candidate "${{ matrix.candidate }}"
          --corpus "${{ matrix.corpus }}"
          --reference-source live
          --strict-reference
          --fail-on regression
          --format summary
          --json-output "reference-${{ matrix.reference }}.json"
          --markdown-output "reference-${{ matrix.reference }}.md"
      - name: Upload live reference artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reference-${{ matrix.reference }}
          path: |
            reference-${{ matrix.reference }}.json
            reference-${{ matrix.reference }}.md
