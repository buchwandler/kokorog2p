name: Run tests
on:
  push:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        test-group: [core, english, german, romance, asian, backends]
    steps:
    - uses: actions/checkout@master
    - name: Setup Python
      uses: actions/setup-python@master
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install espeak-ng (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install espeak-ng (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install espeak-ng
    - name: Install espeak-ng (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install espeak-ng --version=1.52.0 --yes --no-progress --retry-count=5 --retry-wait=10
    - name: Install packages
      run: |
        pip install -e .[all]
        pip install -r requirements-test.txt
        python -m nltk.downloader cmudict
        if [ "${{ matrix.test-group }}" = "core" ] || [ "${{ matrix.test-group }}" = "english" ]; then
          python -m spacy download en_core_web_md
        fi
    - name: Run test group
      shell: bash
      run: |
        case "${{ matrix.test-group }}" in
          core)
            python -m pytest -q tests/test_attr_parser.py tests/test_base.py tests/test_pipeline_api.py tests/test_public_api_consistency.py
            ;;
          english)
            python -m pytest -q -m "not spacy" tests/test_en_*.py tests/test_quote_*.py tests/test_contraction_detection.py tests/test_guarded_abbreviation_merging.py
            ;;

          german)
            python -m pytest -q tests/test_de_g2p.py
            ;;
          romance)
            python -m pytest -q tests/test_fr_g2p.py tests/test_es_g2p.py tests/test_it_g2p.py tests/test_pt_g2p.py
            ;;
          asian)
            python -m pytest -q tests/test_ko_g2p.py tests/test_he_g2p.py tests/test_multilang.py
            ;;
          backends)
            python -m pytest -q tests/test_espeak_*.py tests/test_goruut_backend.py
            ;;
          *)
            echo "Unknown test group: ${{ matrix.test-group }}" >&2
            exit 2
            ;;
        esac
  integration:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Setup Python
      uses: actions/setup-python@master
      with:
        python-version: "3.13"
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install packages and models
      run: |
        pip install -e .[all]
        pip install -r requirements-test.txt
        python -m spacy download en_core_web_md
        python -m nltk.downloader cmudict
    - name: Run full integration suite with RSS reporting
      run: python tools/run_pytest_with_memory.py -q
