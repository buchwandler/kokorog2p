name: CodeCov

on: push

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure Lexphon data home
        run: echo "LEXPHON_DATA_HOME=${RUNNER_TEMP}/lexphon-data" >> "$GITHUB_ENV"
      - name: Install espeak-ng
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y espeak-ng
      - name: Install core test dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Run bounded core coverage
        run: |
          python tools/run_test_suite.py \
            --profile core \
            --batch-size 4 \
            --max-rss-mb auto \
            --coverage \
            --junit-dir junit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
